<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Validação de Certificado
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

  <div class="container">

    <div class="header">

      <h1>
        🎓 Validação de Certificado
      </h1>

      <p class="subtitle">
        Verificação pública de autenticidade
      </p>

    </div>

    <div
      id="loading"
      style="display:none;"
    >
      Carregando...
    </div>

    <div id="result"></div>

  </div>

  <script src="js/app.js"></script>

  <script>

    document.addEventListener(
      'DOMContentLoaded',
      () => {

        const params =
          new URLSearchParams(
            window.location.search
          );

        const codigo =
          params.get('codigo');

        if(codigo){

          const inputFake =
            document.createElement('input');

          inputFake.type = 'hidden';

          inputFake.id = 'codigo';

          inputFake.value = codigo;

          document.body.appendChild(
            inputFake
          );

          verificarCertificado();

        }

      }
    );

  </script>

</body>
</html>
