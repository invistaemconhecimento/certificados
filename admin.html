<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Painel Administrativo
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>

<body>

  <div class="container">

    <div class="header">

      <h1>
        🎓 Painel Administrativo
      </h1>

      <p class="subtitle">
        Cadastro e geração de certificados
      </p>

    </div>

    <div class="card">

      <div class="grid">

        <div class="field">

          <label>
            Código
          </label>

          <input
            type="text"
            id="codigo"
            placeholder="CERT-001"
          >

        </div>

        <div class="field">

          <label>
            Nome do aluno
          </label>

          <input
            type="text"
            id="nome"
          >

        </div>

        <div class="field">

          <label>
            CPF
          </label>

          <input
            type="text"
            id="cpf"
          >

        </div>

        <div class="field">

          <label>
            Curso
          </label>

          <input
            type="text"
            id="curso"
          >

        </div>

        <div class="field">

          <label>
            Carga Horária
          </label>

          <input
            type="number"
            id="carga"
          >

        </div>

        <div class="field">

          <label>
            Aproveitamento
          </label>

          <input
            type="number"
            id="aproveitamento"
          >

        </div>

        <div class="field">

          <label>
            Data da certificação
          </label>

          <input
            type="date"
            id="data"
          >

        </div>

        <div class="field full">

          <label>
            Conteúdo Programático
          </label>

          <textarea
            id="conteudo"
            rows="10"
            placeholder="Um conteúdo por linha"
          ></textarea>

        </div>

      </div>

      <div class="actions">

        <button
          type="button"
          onclick="gerarJSON()"
        >
          Gerar JSON
        </button>

        <button
          type="button"
          onclick="copiarJSON()"
        >
          Copiar JSON
        </button>

        <button
          type="button"
          onclick="gerarQRCodePeloInput()"
        >
          Gerar QR Code
        </button>

        <button
          type="button"
          onclick="abrirValidacao()"
        >
          Abrir Validação
        </button>

      </div>

    </div>

    <div class="card">

      <h2>
        JSON Gerado
      </h2>

      <pre id="jsonOutput"></pre>

    </div>

    <div class="card">

      <h2>
        QR Code
      </h2>

      <div id="qrcode"></div>

    </div>

    <div class="card">

      <h2>
        Pré-visualização
      </h2>

      <div id="previewContent"></div>

    </div>

  </div>

  <script src="js/app.js"></script>
  <script src="js/qrcode.js"></script>

</body>
</html>
