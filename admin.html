<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Administrativo - Staff Consultoria</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<header class="topo">

    <img src="logo.png"
         alt="Staff Consultoria"
         class="logo">

</header>

<main class="conteudo">

    <div class="caixa-admin">

        <h1>Painel Administrativo</h1>

        <p class="subtitulo">
            Cadastro e gerenciamento de certificados.
        </p>

        <input
            id="codigoCadastro"
            placeholder="Código do Certificado">

        <input
            id="nome"
            placeholder="Nome do Aluno">

        <input
            id="cpf"
            placeholder="CPF">

        <input
            id="curso"
            placeholder="Curso">

        <input
            id="cargaHoraria"
            placeholder="Carga Horária">

        <input
            id="aproveitamento"
            placeholder="Aproveitamento">

        <input
            id="dataConclusao"
            placeholder="Data de Conclusão">

        <input
            id="pdfUrl"
            placeholder="Link do PDF">

        <div class="botoes-admin">

            <button onclick="salvarCertificado()">
                Salvar Certificado
            </button>

            <button
                id="btnAtualizar"
                onclick="atualizarCertificado()"
                style="display:none;">
                Atualizar Certificado
            </button>

        </div>

    </div>

    <div class="caixa-admin">

        <h2>Certificados Cadastrados</h2>

        <div id="listaCertificados"></div>

    </div>

</main>

<footer>

    STAFF CONSULTORIA — CNPJ: 39.881.904/0001-09

    <br>

    Belém - Pará

</footer>

<script src="admin.js"></script>

</body>
</html>
