<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel Administrativo</title>

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- QR CODE LIB -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header">

      <h1>🎓 Painel Administrativo</h1>

      <p class="subtitle">
        Cadastro e geração de certificados digitais.
      </p>

    </div>

    <!-- FORM -->
    <div class="card">

      <div class="grid">

        <!-- CÓDIGO -->
        <div class="field">

          <label for="codigo">
            Código do Certificado
          </label>

          <input
            type="text"
            id="codigo"
            placeholder="CERT-0001"
          >

        </div>

        <!-- NOME -->
        <div class="field">

          <label for="nome">
            Nome do Aluno
          </label>

          <input
            type="text"
            id="nome"
            placeholder="Nome completo"
          >

        </div>

        <!-- CPF -->
        <div class="field">

          <label for="cpf">
            CPF
          </label>

          <input
            type="text"
            id="cpf"
            placeholder="000.000.000-00"
          >

        </div>

        <!-- CURSO -->
        <div class="field">

          <label for="curso">
            Curso
          </label>

          <input
            type="text"
            id="curso"
            placeholder="Nome do curso"
          >

        </div>

        <!-- CARGA HORÁRIA -->
        <div class="field">

          <label for="carga">
            Carga Horária
          </label>

          <input
            type="number"
            id="carga"
            placeholder="20"
          >

        </div>

        <!-- APROVEITAMENTO -->
        <div class="field">

          <label for="aproveitamento">
            Aproveitamento (%)
          </label>

          <input
            type="number"
            id="aproveitamento"
            placeholder="95"
          >

        </div>

        <!-- DATA -->
        <div class="field">

          <label for="data">
            Data da Certificação
          </label>

          <input
            type="date"
            id="data"
          >

        </div>

        <!-- CONTEÚDO -->
        <div class="field full">

          <label for="conteudo">
            Conteúdo Programático
          </label>

          <textarea
            id="conteudo"
            placeholder="Digite um item por linha"
          ></textarea>

        </div>

      </div>

      <!-- BOTÕES -->
      <div class="actions">

        <button onclick="gerarJSON()">
          Gerar JSON
        </button>

        <button
          class="copy-btn"
          onclick="copiarJSON()"
        >
          Copiar JSON
        </button>

        <button
          onclick="gerarQRCodePeloInput()"
        >
          Gerar QR Code
        </button>

        <button
          class="copy-btn"
          onclick="baixarQRCode()"
        >
          Baixar QR Code
        </button>

      </div>

      <!-- JSON -->
      <div
        class="json-output"
        id="jsonOutput"
      >
Nenhum JSON gerado ainda.
      </div>

    </div>

    <!-- PREVIEW -->
    <div class="preview">

      <div class="preview-card">

        <h2>
          Pré-visualização
        </h2>

        <div id="previewContent">

          <p>
            Preencha os dados do certificado.
          </p>

        </div>

      </div>

    </div>

    <!-- QR CODE -->
    <div class="card">

      <h2 style="margin-bottom:20px;">
        QR Code do Certificado
      </h2>

      <div
        id="qrcode"
        style="
          display:flex;
          justify-content:center;
          align-items:center;
          min-height:240px;
        "
      ></div>

    </div>

  </div>

  <!-- JS -->
  <script src="js/app.js"></script>
  <script src="js/qrcode.js"></script>

</body>
</html>
