<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Verificação de Certificados
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

  <div class="container">

    <div class="header">

      <h1>
        🎓 Verificação de Certificados
      </h1>

      <p class="subtitle">
        Consulte a autenticidade do certificado
      </p>

    </div>

    <div class="card">

      <div class="search-box">

        <input
          type="text"
          id="codigo"
          placeholder="Digite o código do certificado"
        >

        <button
          type="button"
          onclick="verificarCertificado()"
        >
          Verificar
        </button>

      </div>

      <div
        id="loading"
        style="display:none;"
      >
        Carregando...
      </div>

      <div id="result"></div>

    </div>

  </div>

  <script src="js/app.js"></script>

</body>
</html>
