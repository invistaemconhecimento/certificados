  <style>

</head>
<body>

  <div class="container">

    <div class="logo">
      🎓
    </div>

    <h1>Validar Certificado</h1>

    <p class="subtitle">
      Consulte a autenticidade de certificados emitidos pela escola de treinamentos.
    </p>

    <div class="search-box">

      <input
        type="text"
        id="codigo"
        placeholder="Digite o código do certificado"
      >

      <button onclick="verificarCertificado()">
        Verificar Certificado
      </button>

    </div>

    <div class="loading" id="loading">
      Consultando certificado...
    </div>

    <div class="result" id="result"></div>

    <div class="footer">
      Sistema de Certificação Digital
    </div>

  </div>

  <script>

    const BIN_ID = '6a0a9e5cc0954111d83cf8b4';

    async function verificarCertificado() {

      const codigo = document
        .getElementById('codigo')
        .value
        .trim();

      const result = document.getElementById('result');
      const loading = document.getElementById('loading');

      result.style.display = 'none';
      loading.style.display = 'block';

      try {

        const response = await fetch(
          `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`
        );

        const data = await response.json();

        const certificados = data.record;

        const certificado = certificados.find(
          item => item.codigo.toUpperCase() === codigo.toUpperCase()
        );

        loading.style.display = 'none';

        if(certificado){

          result.innerHTML = `
            <div class="card">

              <div class="valid">
                ✅ Certificado válido
              </div>

              <div class="info">
                <div class="label">Aluno</div>
                <div class="value">${certificado.nome}</div>
              </div>

              <div class="info">
                <div class="label">CPF</div>
                <div class="value">${certificado.cpf}</div>
              </div>

              <div class="info">
                <div class="label">Curso</div>
                <div class="value">${certificado.curso}</div>
              </div>

              <div class="info">
                <div class="label">Carga Horária</div>
                <div class="value">${certificado.carga_horaria} horas</div>
              </div>

              <div class="info">
                <div class="label">Aproveitamento</div>
                <div class="value">${certificado.aproveitamento}%</div>
              </div>

              <div class="info">
                <div class="label">Data da Certificação</div>
                <div class="value">${certificado.data_certificacao}</div>
              </div>

            </div>
          `;

        } else {

          result.innerHTML = `
            <div class="card">

              <div class="invalid">
                ❌ Certificado não encontrado
              </div>

              <p>
                O código informado não existe em nossa base de dados.
              </p>

            </div>
          `;

        }

        result.style.display = 'block';

      } catch(error){

        loading.style.display = 'none';

        result.innerHTML = `
          <div class="card">

            <div class="invalid">
              ⚠️ Erro ao consultar
            </div>

            <p>
              Não foi possível acessar a base de certificados.
            </p>

          </div>
        `;

        result.style.display = 'block';

        console.error(error);

      }

    }

  </script>

</body>
</html>
